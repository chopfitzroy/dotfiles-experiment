# @NOTE
# - https://github.com/asdf-community/asdf-php/issues/145
# - https://github.com/asdf-community/asdf-php/issues/163
- name: Install PHP dependencies on macOS
  homebrew: 
    name:
      - autoconf
      - automake
      - bison
      - freetype
      - gd
      - gettext
      - icu4c
      - krb5
      - libedit
      - libiconv
      - libjpeg
      - libpng
      - libxml2
      - libzip
      - openssl
      - pkg-config
      - re2c
      - readline
      - zlib
    state: present

- name: Get openssl path
  command: brew --prefix openssl
  register: openssl_path
  changed_when: false

- name: Get readline path
  command: brew --prefix readline
  register: readline_path
  changed_when: false

- name: Get iconv path
  command: brew --prefix libiconv
  register: iconv_path
  changed_when: false

- name: Install php plugin via asdf
  command:
    cmd: "{{ asdf_bin }}/asdf plugin add php https://github.com/asdf-community/asdf-php.git"
    creates: "{{ asdf_home }}/plugins/php"

- name: Install php via asdf
  command:
    cmd: "{{ asdf_bin }}/asdf install php latest"
  environment: 
    PATH: '{{ asdf_bin }}:{{ ansible_env.PATH }}'
    PHP_CONFIGURE_OPTIONS: "--with-openssl={{ openssl_path.stdout }} --with-readline={{ readline_path.stdout }} --with-iconv={{ iconv_path.stdout }}"

- name: Set global php version via asdf
  command:
    cmd: "{{ asdf_bin }}/asdf global php latest"
