# Use delta for syntax aware diffs
git:
  paging:
    colorArg: always
    pager: delta --paging=never --syntax-theme=ansi

gui:
  # Refresh every second to see AI changes live
  refreshInterval: 1

os:
  # Use Helix for quick edits (uses hx binary)
  editPreset: 'helix'

# Return to lazygit immediately after editing
promptToReturnFromSubprocess: false
